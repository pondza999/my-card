<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลติดต่อ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f7;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .background-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 113, 227, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
            top: 10%;
            left: 25%;
            border-radius: 50%;
            z-index: 1;
        }

        .background-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(142, 142, 147, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            bottom: 10%;
            right: 25%;
            border-radius: 50%;
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04),
                        0 2px 6px rgba(0, 0, 0, 0.02),
                        inset 0 1px 1px rgba(255, 255, 255, 0.9);
            padding: 44px 36px;
        }

        .glass-card h2 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            color: #1d1d1f;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .glass-card p.subtitle {
            font-size: 15px;
            text-align: center;
            color: #86868b;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
            margin-left: 2px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 18px;
            font-size: 16px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #1d1d1f;
            outline: none;
            transition: all 0.2s cubic-bezier(0, 0, 0.2, 1);
        }

        .input-group input::placeholder {
            color: #86868b;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            background: #0071e3;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: #0077ed;
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.35);
            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            background: #a1a1a6;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="background-glow-1"></div>
    <div class="background-glow-2"></div>

    <div class="glass-card">
        <h2>กรอกข้อมูลติดต่อ</h2>
        <p class="subtitle">ระบุข้อมูลของท่านเพื่อติดต่อกลับและจัดส่งเอกสารรับซ่อม</p>

        <form id="contactForm">
            <div class="input-group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" name="phone" placeholder="08X-XXX-XXXX" pattern="[0-9]{9,10}" title="กรุณากรอกเบอร์โทรศัพท์ตัวเลข 9-10 หลัก" required>
            </div>

            <div class="input-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <button type="submit" id="submitBtn">ส่งข้อมูล</button>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx2B4e3WWdY3KVAXDD6AaUiWrO3RaByHwIp2IBC4HNmDgjtSosSHJjKbN-pusooZtKm/exec';
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังส่งข้อมูล...';

            const formData = new URLSearchParams();
            formData.append('phone', form.phone.value);
            formData.append('email', form.email.value);

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
            .then(() => {
                alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerText = 'ส่งข้อมูล';
            })
            .catch(error => {
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                submitBtn.disabled = false;
                submitBtn.innerText = 'ส่งข้อมูล';
            });
        });
    </script>

</body>
</html>
