<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบอ่านบัตรประชาชน | Powered by POND</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* ---------- Splash Screen ---------- */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-text {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease forwards 0.2s;
        }

        .splash-sub {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 8px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .splash-hide {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* ---------- Main ---------- */
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.05);
            padding: 32px;
            border: 1px solid var(--border);
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.6s ease, transform 0.4s ease, box-shadow 0.4s ease;
        }

        .container.show {
            opacity: 1;
            transform: scale(1);
        }

        /* อนิเมชันตอนเลื่อนเมาส์ไปที่การ์ดหลัก */
        .container.show:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 40px -10px rgba(37, 99, 235, 0.18);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 16px;
            width: 100%;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .status-badge.connecting { background-color: #f1f5f9; color: var(--text-muted); }
        .status-badge.connected { background-color: var(--success-bg); color: var(--success-text); }
        .status-badge.disconnected { background-color: var(--danger-bg); color: var(--danger-text); }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .status-badge.connected .status-dot {
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(21, 128, 61, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(21, 128, 61, 0); }
            100% { box-shadow: 0 0 0 0 rgba(21, 128, 61, 0); }
        }

        /* ---------- ปุ่มต่างๆ ---------- */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -6px rgba(15, 23, 42, 0.2);
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
            box-shadow: none;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn.copied {
            background: var(--success-bg);
            border-color: #86efac;
            color: var(--success-text);
        }

        .btn-refresh:hover .refresh-icon {
            transform: rotate(180deg);
        }

        .refresh-icon {
            display: inline-block;
            transition: transform 0.4s ease;
        }

        /* ---------- ข้อมูลบัตร ---------- */
        .card-data {
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .field-value {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            min-height: 46px;
            display: flex;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        /* อนิเมชันตอนเลื่อนเมาส์ไปที่ช่องข้อมูล */
        .field-row:hover .field-value {
            transform: translateX(4px);
            border-color: #93c5fd;
            background: #f0f7ff;
            box-shadow: 0 6px 14px -8px rgba(37, 99, 235, 0.45);
        }

        .field-value.highlight {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary);
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .btn-copy {
            flex: 0 0 auto;
            width: auto;
            padding: 0 14px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        .placeholder-state {
            text-align: center;
            padding: 36px 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
            border: 2px dashed var(--border);
            border-radius: 14px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .placeholder-state:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        .placeholder-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s ease;
        }

        .placeholder-state:hover .placeholder-icon {
            transform: translateY(-6px) scale(1.1);
        }

        .footer-credit {
            text-align: center;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #0f172a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 0.875rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-text">⚡ Powered by POND</div>
        <div class="splash-sub">Smart Card Reader System</div>
    </div>

    <div class="container" id="mainContainer">
        <div class="header">
            <h2>🪪 ระบบอ่านบัตรประชาชน</h2>
            <p>เสียบบัตรประชาชนเข้ากับเครื่องอ่านเพื่อดึงข้อมูลอัตโนมัติ</p>
        </div>

        <div id="statusBadge" class="status-badge connecting">
            <span class="status-dot"></span>
            <span id="statusText">กำลังเชื่อมต่อระบบ...</span>
        </div>

        <div class="toolbar">
            <button class="btn btn-refresh" id="refreshBtn"><span class="refresh-icon">🔄</span> รีเฟรชหน้า</button>
        </div>

        <div id="contentArea">
            <div class="placeholder-state">
                <span class="placeholder-icon">💳</span>
                กรุณาเสียบบัตรประชาชนเข้ากับเครื่องอ่าน
            </div>
        </div>

        <div class="footer-credit">
            Powered by POND
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ---------- Splash ----------
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('splash-hide');
                document.getElementById('mainContainer').classList.add('show');
                document.body.style.overflow = 'auto';
            }, 2000);
        });

        // ---------- Helpers ----------
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const contentArea = document.getElementById('contentArea');
        const refreshBtn = document.getElementById('refreshBtn');
        const toastEl = document.getElementById('toast');

        let currentFields = []; // เก็บข้อมูลล่าสุดสำหรับปุ่มคัดลอก

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ตัดคำนำหน้าชื่อ (ไทย)
        function stripThaiPrefix(name) {
            let s = String(name ?? '').replace(/#+/g, ' ').replace(/\s+/g, ' ').trim();
            s = s.replace(/^(นางสาว|น\.ส\.|นาง|นาย|เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.)\s+/, '');
            return s.trim();
        }

        // ตัดคำนำหน้าชื่อ (อังกฤษ)
        function stripEnPrefix(name) {
            let s = String(name ?? '').replace(/#+/g, ' ').replace(/\s+/g, ' ').trim();
            s = s.replace(/^(Mr|Mrs|Miss|Ms|Master|Mstr)\.?\s+/i, '');
            return s.trim();
        }

        // คัดลอกข้อความ (มี fallback เผื่อเปิดจากไฟล์ในเครื่อง)
        async function copyText(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
                throw new Error('no clipboard api');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
                document.body.removeChild(ta);
                return ok;
            }
        }

        let toastTimer;
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
        }

        function flashButton(btn, doneText) {
            const original = btn.innerHTML;
            btn.classList.add('copied');
            btn.innerHTML = doneText;
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = original;
            }, 1200);
        }

        // ---------- ปุ่มรีเฟรช ----------
        refreshBtn.addEventListener('click', () => location.reload());

        // ---------- แสดงข้อมูล ----------
        function renderCard(data) {
            currentFields = [
                { label: 'เลขประจำตัวประชาชน', value: data.cid || '-', highlight: true },
                { label: 'ชื่อ - นามสกุล (ไทย)', value: stripThaiPrefix(data.nameTh) || '-' },
                { label: 'ชื่อ - นามสกุล (อังกฤษ)', value: stripEnPrefix(data.nameEn) || '-' },
                { label: 'วันเกิด', value: data.dob || '-' },
                { label: 'ที่อยู่ตามบัตร', value: data.address || '-' }
            ];

            contentArea.innerHTML = `<div class="card-data">` + currentFields.map((f, i) => `
                <div class="field-group">
                    <span class="field-label">${escapeHtml(f.label)}</span>
                    <div class="field-row">
                        <div class="field-value ${f.highlight ? 'highlight' : ''}">${escapeHtml(f.value)}</div>
                        <button class="btn btn-copy" data-index="${i}">📋 คัดลอก</button>
                    </div>
                </div>
            `).join('') + `</div>`;

            contentArea.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const field = currentFields[btn.dataset.index];
                    const ok = await copyText(field.value);
                    if (ok) {
                        flashButton(btn, '✅ แล้ว');
                        showToast('คัดลอก' + field.label + 'แล้ว');
                    } else {
                        showToast('คัดลอกไม่สำเร็จ');
                    }
                });
            });
        }

        // ---------- WebSocket ----------
        const ws = new WebSocket('ws://localhost:8080');

        ws.onopen = () => {
            statusBadge.className = 'status-badge connected';
            statusText.innerText = 'พร้อมใช้งาน (รอการเสียบบัตร)';
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.status === 'success') {
                renderCard(response.data);
            }
        };

        ws.onclose = () => {
            statusBadge.className = 'status-badge disconnected';
            statusText.innerText = 'ตัดการเชื่อมต่อ (โปรดเปิดโปรแกรม Terminal พิมพ์  cd ~/Desktop/my-card
node read.js เพื่อเปิดใช้งาน )';
            currentFields = [];
            contentArea.innerHTML = `
                <div class="placeholder-state">
                    <span class="placeholder-icon">⚠️</span>
                    ไม่สามารถเชื่อมต่อกับเครื่องอ่านบัตรได้
                </div>
            `;
        };
    </script>
</body>
</html>
